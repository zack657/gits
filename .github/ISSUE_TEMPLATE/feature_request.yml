name: Feature request
description: Suggest an improvement for Git Account Binder.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the workflow or behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe other approaches you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This feature avoids committing private keys, tokens, local databases, or sensitive repository data.
          required: true
